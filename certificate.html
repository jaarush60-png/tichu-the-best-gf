<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Best Girlfriend Certificate 🌻</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Background Music -->
<audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Sunset -->
<div class="sunset"></div>

<!-- Petals -->
<div id="petals"></div>

<!-- Sparkles -->
<div id="sparkles"></div>

<!-- Hearts -->
<div class="hearts"></div>

<div class="certificate-container">

<h1>🌻 Certified With Love 🌻</h1>

<img
src="certificate.jpg"
alt="Best Girlfriend Certificate"
class="certificate">

<p class="caption">

This certificate proudly recognizes you as the

<strong>World's Best Girlfriend.</strong>

Thank you for filling my life with happiness,

love and countless beautiful memories.

Happy Girlfriend Day! 💛🌻

</p>

<button onclick="celebrate()">
❤️ Love You Forever ❤️

</button>

</div>

<script>

function celebrate(){

alert("💛 I Love You More Than Words Can Ever Say. Happy Girlfriend Day! 🌻❤️");

}

</script>

</body>

</html>
